# PRODUCAO — este arquivo e a stack `game-jam` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda. Ou seja: **mexer aqui implanta**. Nao ha passo manual depois do merge.
#
# O que NAO esta aqui: as senhas. `${DB_PASSWORD}`, `${JWT_SECRET}` e
# `${DATABASE_URL}` sao referencias — os valores vivem nas variaveis da stack,
# dentro do Portainer, e nunca entram no git.
#
# Para rodar o back-end na sua maquina, use back-end/docker-compose.yml, que e
# outro arquivo e tem outra finalidade.
#
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    # mysql:9.5.0 — digest tirado do container que estava em execucao, nao do
    # registry: a tag 9.5.0 disponivel na VM NAO e a mesma imagem que rodava.
    # Trilha Innovation, suporte curto. A LTS e a 8.4, mas o diretorio de dados
    # da 9.5 nao abre em versao anterior: migrar exige dump e restore.
    image: mysql@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef
    container_name: game-jam_database
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - database-data:/var/lib/mysql

    # O back-end aplica as migracoes ao subir, e para isso precisa do banco ja
    # aceitando conexao. O depends_on sozinho garante so a ORDEM de partida,
    # nao a prontidao: sem este healthcheck o back-end tentava migrar contra um
    # MySQL ainda inicializando, falhava e reiniciava em laco ate dar certo.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Nao conta falha durante a partida. O diretorio de dados ja existe, entao
      # a subida e rapida; a folga aqui e para o caso de restore ou disco lento.
      start_period: 40s
    networks:
      internal:
        # Alias com o projeto no nome, e NAO opcional: o back-end tambem esta
        # na rede "traefik", que e compartilhada pelas dez stacks, e la existe
        # outro servico chamado "database" (o do introcomp). Sem este alias o
        # DNS do Docker resolve "database" para o banco da OUTRA stack, e o
        # erro que aparece e "authentication failed for root" — que manda quem
        # investiga procurar senha, nao nome.
        # Hifen e nao underscore porque nome de host nao aceita underscore.
        aliases:
          - game-jam-database

  back-end:
    # ghcr.io/pet-eng-comp-org/game-jam/back-end:sha-5f495b5f0616e9e40fffd1d7dfe510215e5250c8
    # Inclui o limite de taxa no login e na inscricao (PR #46).
    image: ghcr.io/pet-eng-comp-org/game-jam/back-end@sha256:bcbb0d5f40fc6beee29e12e763ddccfd29fd360b4e5068af38f43cbb57c96cf4
    container_name: game-jam_back-end
    restart: unless-stopped
    logging: *logging
    stdin_open: true
    tty: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-jam_back-end.rule=Host(`apigamejam.pet.inf.ufes.br`)"
      - "traefik.http.services.game-jam_back-end.loadbalancer.server.port=3333"
      - "traefik.http.routers.game-jam_back-end.entrypoints=websecure"
      - "traefik.http.routers.game-jam_back-end.tls.certresolver=le"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - internal
    volumes:
      - uploads:/app/tmp

  # O site do Game Jam. Next em modo standalone (server.js), agora servido pela
  # VM como as demais stacks — antes vivia so na Vercel. A URL da API
  # (https://apigamejam.pet.inf.ufes.br) e assada no build pelo workflow do
  # front, entao aqui nao ha env de execucao nem rede interna: o navegador chama
  # a API pelo dominio publico. So falta o LAR apontar gamejam.pet para a VM.
  front-end:
    # ghcr.io/pet-eng-comp-org/game-jam/front-end:latest (sha-b022d77f9ca64ae8ed74004a4292304c881745f6)
    image: ghcr.io/pet-eng-comp-org/game-jam/front-end@sha256:909d2f83bad6055bb2b09e82d878dae7e1ac0a57acd57ca3cab0863d42ca53b1
    container_name: game-jam_front-end
    restart: unless-stopped
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-jam_front-end.rule=Host(`gamejam.pet.inf.ufes.br`)"
      - "traefik.http.services.game-jam_front-end.loadbalancer.server.port=3000"
      - "traefik.http.routers.game-jam_front-end.entrypoints=websecure"
      - "traefik.http.routers.game-jam_front-end.tls.certresolver=le"
      - "traefik.docker.network=traefik"
    networks:
      - traefik

  database-client:
    # phpmyadmin:5.2.3 — digest do container em execucao.
    # Nao pode sair: nao existe rota GET /participante na API, entao ele e a
    # unica forma de a organizacao ver os inscritos. Por isso fica atras de
    # basicauth, e nao removido.
    image: phpmyadmin@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    container_name: game-jam_database-client
    restart: unless-stopped
    logging: *logging
    environment:
      - PMA_HOST=game-jam-database
      - PMA_ABSOLUTE_URI=https://gamejam-db.pet.inf.ufes.br
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-jam_database-client.rule=Host(`gamejam-db.pet.inf.ufes.br`)"
      - "traefik.http.services.game-jam_database-client.loadbalancer.server.port=80"
      - "traefik.http.routers.game-jam_database-client.entrypoints=websecure"
      - "traefik.http.routers.game-jam_database-client.tls.certresolver=le"
      - "traefik.docker.network=traefik"
      # Hash bcrypt, com os $ dobrados para o compose nao tratar como variavel.
      - "traefik.http.middlewares.game-jam_database-client-auth.basicauth.users=game-jam:$$2b$$12$$H7UEfZoGNPyFTPZslcA3ruoahMQ6g2dBnAqkYUJe6hlG59pm/Y5BW"
      - "traefik.http.routers.game-jam_database-client.middlewares=game-jam_database-client-auth"
    networks:
      - traefik
      - internal

  # Acervo dos jogos das edicoes passadas. Sao jogos estaticos — HTML, JS e
  # imagem — entao basta um servidor de arquivo; nao ha build nem banco.
  #
  # Os arquivos NAO moram no repositorio: sao 240 MB, e no repositorio eles
  # estourariam o limite de implantacao da Vercel e cairiam no clone de quem so
  # quer mexer numa cor. Moram em /opt/game-jam/arquivo, no disco da VM.
  #
  # O caminho e /arquivo no MESMO dominio da API, que ja aponta para a VM. Isso
  # evita pedir nome novo ao LAR: um dominio serve quantos jogos existirem,
  # porque o que separa cada um e caminho, nao DNS.
  arquivo:
    image: nginx:1.29-alpine
    container_name: game-jam_arquivo
    restart: unless-stopped
    logging: *logging
    volumes:
      - /opt/game-jam/arquivo:/usr/share/nginx/html/arquivo:ro
      - /opt/game-jam/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # A regra e mais especifica que a do back-end (mesmo Host, mais o
      # PathPrefix), e no Traefik regra mais longa vence por padrao. A
      # prioridade vai explicita mesmo assim: se esta ordem inverter, o
      # /arquivo cai na API e devolve 404 em vez do jogo.
      - "traefik.http.routers.game-jam_arquivo.rule=Host(`apigamejam.pet.inf.ufes.br`) && PathPrefix(`/arquivo`)"
      - "traefik.http.routers.game-jam_arquivo.priority=100"
      - "traefik.http.services.game-jam_arquivo.loadbalancer.server.port=80"
      - "traefik.http.routers.game-jam_arquivo.entrypoints=websecure"
      - "traefik.http.routers.game-jam_arquivo.tls.certresolver=le"
      - "traefik.docker.network=traefik"
    networks:
      - traefik

volumes:
  database-data:
  uploads:

networks:
  traefik:
    name: traefik
  internal:
    internal: true

