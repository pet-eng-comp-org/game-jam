name: Confere se o site no ar e o commit do main

# Nasceu de uma falha real na Vercel, onde o site morou ate 01/09/2026: ela
# recusava em silencio commit de quem nao fosse a conta do PET, e o site serviu
# um build de dezembro por seis semanas. Na VM a pergunta continua: "o que esta
# no ar e o que esta no main?". Este workflow olha o RESULTADO, nao o processo:
# busca o site e compara o carimbo de versao com o commit que acabou de entrar.

on:
  push:
    branches: [main]
    paths:
      - 'front-end/**'
      - '.github/workflows/confere-versao-no-ar.yml'
  workflow_dispatch:

jobs:
  confere:
    runs-on: ubuntu-latest
    steps:
      - name: Espera o deploy e compara
        env:
          SITE: https://gamejam.pet.inf.ufes.br
          ESPERADO: ${{ github.sha }}
        run: |
          echo "Commit que entrou no main: $ESPERADO"

          # Ate 20 tentativas espacadas de 30s: testes e build (~5 min), o commit
          # de deploy e o Portainer, que aplica em ate 5 min.
          for i in $(seq 1 20); do
            HTML=$(curl -fsSL --max-time 20 "$SITE" || true)
            NO_AR=$(printf '%s' "$HTML" | grep -oE 'name="versao" content="[^"]*"' | head -1 | sed -E 's/.*content="([^"]*)".*/\1/')

            if [ -z "$NO_AR" ]; then
              echo "tentativa $i: o site nao expoe carimbo de versao ainda"
            elif [ "$NO_AR" = "$ESPERADO" ]; then
              echo "OK: o site esta servindo $NO_AR"
              exit 0
            else
              echo "tentativa $i: no ar esta $NO_AR"
            fi
            sleep 30
          done

          echo
          echo "::error::O site NAO esta servindo o commit $ESPERADO."
          echo "Confira o workflow publica-front-end (testes, build e o commit"
          echo "deploy:) e, se ele passou, a stack game-jam no Portainer."
          exit 1
