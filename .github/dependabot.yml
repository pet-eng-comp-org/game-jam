# Um arquivo para os dois projetos.
#
# Sem agrupamento o Dependabot abre um PR por pacote: no primeiro dia foram 25
# alertas no backend e 32 no frontend.
#
# Os grupos so juntam minor e patch. Major sai sempre em PR proprio, porque na
# primeira semana os grupos vieram carregando Prisma 6->7, TypeScript 5->7,
# eslint 9->10 e cookies-next 5->6 no meio de correcoes de rotina. Migracao de
# major precisa ser lida e testada sozinha.

version: 2

updates:
  - package-ecosystem: npm
    directory: /back-end
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      back-end-producao:
        dependency-type: production
        update-types: ["minor", "patch"]
      back-end-desenvolvimento:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # O express 5 exige tirar o express-async-errors, que so suporta o 4 e nao
      # recebe versao nova desde 2019. Com os dois juntos o npm ci morre em
      # ERESOLVE e a imagem nao constroi — foi o que derrubou o primeiro PR
      # agrupado do backend. Voltar a considerar quando o pacote sair do projeto:
      # o express 5 trata rejeicao de promessa sozinho e o express-async-errors
      # deixa de ser necessario.
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      # @types/node tem que acompanhar o major do Node da imagem base, hoje 24.
      # Tipo mais novo que o runtime descreve API que nao existe em execucao, e
      # o compilador aceita — a falha aparece so rodando. O Dependabot ofereceu
      # o 26 em 20/08/2026 e foi recusado por isso. Quando a base subir de
      # major, subir este junto e a mao.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Prisma 7 muda o gerador do client e quebra o build; CLI (prisma) e client
      # (@prisma/client) tem que subir JUNTOS, na mesma versao, senao o prisma
      # generate falha — e o Dependabot abre um PR para cada. Recusado em 20/08 e
      # de novo em 22/09/2026. Migrar de proposito, os dois num PR, com os testes.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /front-end
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      front-end-producao:
        dependency-type: production
        update-types: ["minor", "patch"]
      front-end-desenvolvimento:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Mesmo criterio do back-end: @types/node acompanha o major do Node que roda
      # o site (24). O 26 foi oferecido aqui em 31/08/2026 e recusado.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # O Dockerfile do back-end fixa a imagem base por digest. E o Dependabot que
  # traz o digest novo quando a node:24 recebe correcao — sem isso, o pino vira
  # imagem parada.
  - package-ecosystem: docker
    directory: /back-end
    schedule:
      interval: weekly
    ignore:
      # Major do Node so entra quando a versao for LTS. O Dependabot ofereceu o
      # 26 em 20/08/2026, que e linha Current: suporte curto e mudanca durante
      # o ciclo. API em producao nao anda nela. Quando o 26 virar LTS, remover
      # esta regra e subir de proposito.
      # Patch e minor do digest continuam entrando — e o que mantem o pino vivo.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
